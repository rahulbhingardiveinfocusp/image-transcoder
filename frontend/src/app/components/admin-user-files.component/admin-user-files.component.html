<div class="dashboard">

  <div class="header-card">

    <div class="header-left">

      <div class="title-row">
        <div class="logo-badge">📁</div>

        <div>
          <h1>User Files</h1>
          <p>User Id: {{ userId }}</p>
        </div>

      </div>

    </div>

    <button
      class="btn ghost"
      (click)="back()">

      ← Back To Users

    </button>

  </div>

  <div class="card">

    <table class="table">

      <thead>
        <tr>
          <th>Preview</th>
          <th>Filename</th>
          <th>Status</th>
          <th>Created</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngIf="files.length === 0">
          <td colspan="4" class="empty">
            No files found
          </td>
        </tr>

        <tr
          *ngFor="let file of files; trackBy: trackById">

          <td>
            <img
              class="processe-file"
              [src]="file.url"
              [alt]="file.filename">
          </td>

          <td>{{ file.filename }}</td>

          <td>
            <span
              class="badge"
              [ngClass]="getStatusClass(file.status)">
              {{ file.status }}
            </span>
          </td>

          <td>
            {{ file.created_at | date:'medium' }}
          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
