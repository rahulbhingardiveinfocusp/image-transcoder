<div class="auth-container">

  <div class="auth-card">

    <h2>AWS Cognito Authentication</h2>

    <div
      *ngIf="error"
      class="error">
      {{ error }}
    </div>

    <div
      *ngIf="success"
      class="success">
      {{ success }}
    </div>

    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="email">

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password">

    <div class="buttons">

      <button
        (click)="login()"
        [disabled]="loading">

        Login
      </button>

      <button
        (click)="signup()"
        [disabled]="loading">

        Sign Up
      </button>

    </div>

    <div *ngIf="showConfirmation">

      <input
        placeholder="Verification Code"
        [(ngModel)]="verificationCode">

      <button
        (click)="confirmSignup()">

        Verify Account
      </button>

    </div>

  </div>

</div>
