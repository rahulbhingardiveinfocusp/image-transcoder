<div class="dashboard">

  <!-- HEADER -->
<div class="header-card">

  <div class="header-left">

    <div class="title-row">
      <div class="logo-badge">📸</div>

      <div>
        <h1>File Crop</h1>
      
      </div>
    </div>

   

  </div>

  <div class="header-actions">

    <button class="btn ghost" (click)="loadImages()">
      ↻ Refresh
    </button>

  </div>

</div>

  <!-- UPLOAD CARD -->
  <div class="card toolbar">

  <!-- LEFT: Upload -->
  <div class="toolbar-left">

    <input #fileInput type="file" (change)="onFileSelected($event)" />

    <button
      class="btn primary"
      (click)="onUpload()"
      [disabled]="!selectedFile || uploading">

      {{ uploading ? 'Uploading...' : 'Upload Image' }}
    </button>


  </div>

  <!-- RIGHT: Filters -->
  <div class="toolbar-right">

    <input
      type="text"
      placeholder="Search filename..."
      [(ngModel)]="searchTerm" />

    <select [(ngModel)]="statusFilter">
      <option value="ALL">All Status</option>
      <option value="pending">Pending</option>
      <option value="processing">Processing</option>
      <option value="completed">Completed</option>
      <option value="failed">Failed</option>
    </select>

  </div>


  </div>

  <!-- TABLE -->
  <div class="card table-card">

    <table class="table">

      <thead>
        <tr>
           <th >file</th>
          <th (click)="sort('filename')">Filename</th>
          <th>Status</th>
          <th (click)="sort('created_at')">Created</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngIf="filteredImages.length === 0">
          <td colspan="3" class="empty">No images found</td>
        </tr>

        <tr *ngFor="let img of filteredImages; trackBy: trackById">
          <td><img src="{{img.url}}"/> </td>
          <td class="filename">{{ img.filename }}</td>

          <td>
            <span class="badge" [ngClass]="getStatusClass(img.status)">
              {{ img.status }}
            </span>
          </td>

          <td class="date">
            {{ img.created_at | date:'medium' }}
          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
