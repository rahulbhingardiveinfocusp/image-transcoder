apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:latest
          ports:
            - containerPort: 4566
          env:
            - name: SERVICES
              value: "s3,sqs,ses,dynamodb"
            - name: DEBUG
              value: "1"
            - name: AWS_DEFAULT_REGION
              value: "us-west-1"
            - name: LOCALSTACK_AUTH_TOKEN
              value: "ls-VEsOwoXA-CiCu-5549-CIWa-SAkIfiSI6952"
          volumeMounts:
            - name: data
              mountPath: /var/lib/localstack
            - name: init-script
              mountPath: /etc/localstack/init/ready.d/init-aws.sh
              subPath: init-aws.sh
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: init-script
          hostPath:
            path: /home/rahul.bhingardive/Practice Projects/image-transcoder/init-aws.sh
            type: File