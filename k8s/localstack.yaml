apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: app-local
spec:
  replicas: 1
  selector:
    matchLabels: { app: localstack }
  template:
    metadata:
      labels: { app: localstack }
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.4
          ports:
            - containerPort: 4566
          env:
            - name: SERVICES
              value: "s3,sqs,dynamodb"
            - name: DEFAULT_REGION
              value: "us-east-1"
            - name: PERSISTENCE
              value: "1"
            - name: LOCALSTACK_AUTH_TOKEN
              value: ls-VEsOwoXA-CiCu-5549-CIWa-SAkIfiSI6952
          readinessProbe:
            httpGet: { path: /_localstack/health, port: 4566 }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/localstack
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: app-local
spec:
  selector: { app: localstack }
  ports:
    - port: 4566
      targetPort: 4566