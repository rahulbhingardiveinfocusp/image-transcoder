apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: app-local
spec:
  replicas: 1
  selector:
    matchLabels: { app: fastapi }
  template:
    metadata:
      labels: { app: fastapi }
    spec:
      containers:
        - name: fastapi
          image: fastapi-app:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - name: CONTAINER_ROLE
              value: "web"
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi
  namespace: app-local
spec:
  type: NodePort
  selector: { app: fastapi }
  ports:
    - port: 8000
      targetPort: 8000