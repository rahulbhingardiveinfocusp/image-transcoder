apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-init
data:
  init-aws.sh: |
    #!/bin/bash
    set -e

    BUCKET_NAME="my-test-bucket"
    QUEUE_NAME="image-processing-queue"
    CELERY_QUEUE_NAME="simple-celery-queue"
    DYNAMO_TABLE="images"

    echo "Creating S3 bucket: $BUCKET_NAME..."
    awslocal s3 mb s3://$BUCKET_NAME

    echo "Setting CORS policy on $BUCKET_NAME..."
    cat <<EOF > /tmp/s3-cors.json
    {
        "CORSRules": [
            {
                "AllowedHeaders": ["*"],
                "AllowedMethods": ["PUT", "POST", "GET"],
                "AllowedOrigins": ["*"],
                "ExposeHeaders": ["ETag"]
            }
        ]
    }
    EOF
    awslocal s3api put-bucket-cors --bucket $BUCKET_NAME --cors-configuration file:///tmp/s3-cors.json

    echo "Verifying SES email identities..."
    awslocal ses verify-email-identity --email-address test@example.com
    awslocal ses verify-email-identity --email-address notifications@yourdomain.com
    awslocal ses verify-email-identity --email-address madnands5@gmail.com

    echo "Creating SQS queue: $QUEUE_NAME..."
    QUEUE_URL=$(awslocal sqs create-queue --queue-name $QUEUE_NAME --query 'QueueUrl' --output text)
    QUEUE_ARN=$(awslocal sqs get-queue-attributes \
        --queue-url $QUEUE_URL \
        --attribute-name QueueArn \
        --query 'Attributes.QueueArn' \
        --output text)

    echo "Creating SQS queue: $CELERY_QUEUE_NAME..."
    awslocal sqs create-queue \
        --queue-name $CELERY_QUEUE_NAME \
        --attributes VisibilityTimeout=3600

    echo "Wiring S3 → SQS event notification (raw/ prefix)..."
    cat <<EOF > /tmp/notification.json
    {
      "QueueConfigurations": [
        {
          "QueueArn": "$QUEUE_ARN",
          "Events": ["s3:ObjectCreated:*"],
          "Filter": {
            "Key": {
              "FilterRules": [
                {"Name": "prefix", "Value": "raw/"}
              ]
            }
          }
        }
      ]
    }
    EOF
    awslocal s3api put-bucket-notification-configuration \
        --bucket $BUCKET_NAME \
        --notification-configuration file:///tmp/notification.json

    echo "Creating DynamoDB table: $DYNAMO_TABLE (single-table design, PK/SK + GSI1)..."
    awslocal dynamodb create-table \
      --table-name $DYNAMO_TABLE \
      --attribute-definitions \
        AttributeName=PK,AttributeType=S \
        AttributeName=SK,AttributeType=S \
        AttributeName=GSI1PK,AttributeType=S \
        AttributeName=GSI1SK,AttributeType=S \
      --key-schema \
        AttributeName=PK,KeyType=HASH \
        AttributeName=SK,KeyType=RANGE \
      --global-secondary-indexes \
        '[{
          "IndexName": "GSI1",
          "KeySchema": [
            {"AttributeName": "GSI1PK", "KeyType": "HASH"},
            {"AttributeName": "GSI1SK", "KeyType": "RANGE"}
          ],
          "Projection": {"ProjectionType": "ALL"}
        }]' \
      --billing-mode PAY_PER_REQUEST

    echo "LocalStack resources initialized successfully."
    echo "  S3 bucket   : $BUCKET_NAME"
    echo "  SQS (S3)    : $QUEUE_URL"
    echo "  SQS (Celery): $CELERY_QUEUE_NAME"
    echo "  DynamoDB    : $DYNAMO_TABLE"
    echo "LocalStack init complete."